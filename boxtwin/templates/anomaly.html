<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071526"><title>Incidente #{{ anomaly_id }} | BoxTwin</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<header class="topbar"><div class="brand"><img class="brand-logo" src="{{ url_for('static', filename='img/hydrogeni-lab-logo.png') }}" alt="HydrogenI"><div><span>HYDROGENI · INCIDENTE</span><h1>Anomalia #{{ anomaly_id }}</h1></div></div><a class="badge" href="/admin">← Central operacional</a></header><main>
<section id="incidentSummary" class="hero"><div><span class="eyebrow">CARREGANDO</span><h2>Detalhes da ocorrência</h2></div></section>
<section class="admin-grid"><article class="panel"><span class="eyebrow">DADOS DA LEITURA</span><h3>Evidências</h3><div id="readingDetail" class="detail-grid"></div><div id="incidentGrid" class="grid"></div></article><aside class="panel"><span class="eyebrow">TRATATIVA</span><h3>Atualizar situação</h3><div class="quick-prompts"><button id="verifyButton" class="secondary compact" type="button">Verificar</button><button id="treatedButton" class="primary compact" type="button">Tratado</button></div><form id="statusForm" class="stack-form"><select id="incidentStatus"><option value="acknowledged">Ciente</option><option value="in_progress">Em atendimento</option><option value="resolved">Resolvida</option><option value="false_positive">Falso positivo</option></select><textarea id="incidentNote" rows="4" placeholder="Observação técnica"></textarea><button class="primary">Salvar atualização</button></form><button id="suggestTreatment" class="secondary">Sugerir tratativa com IA</button><div id="treatment" class="assistant-answer">Aguardando consulta.</div></aside></section>
<section class="panel"><span class="eyebrow">RASTREABILIDADE</span><h3>Linha do tempo</h3><div id="timeline" class="timeline"></div></section></main><script>window.ANOMALY_ID={{ anomaly_id }};</script><script src="{{ url_for('static', filename='anomaly.js') }}"></script></body></html>
